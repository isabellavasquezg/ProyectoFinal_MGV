{% extends 'base.html' %}

{% block title %}Login - Gestor LIME{% endblock %}

{% block navbar %}
    {% endblock %}

{% block footer %}
    {% endblock %}
{% block extra_css %}
<style>
    html, body {
        height: 100%;
        margin: 0;
        padding: 0;
    }
    :root {
        --color-primario-oscuro: #004D79; /* Azul marino */
        --color-acento-claro: #00A5AD;   /* Cian / Turquesa */
        --color-intermedio: #3075A0;     /* Azul intermedio más suave */
        --color-blanco: #fff;
    }
    main {
        background: linear-gradient(135deg, var(--color-primario-oscuro) 0%, var(--color-intermedio) 50%, var(--color-acento-claro) 100%);
    }
    .login-card {
        background: var(--color-blanco);
        border-radius: 20px;
        box-shadow: 0 8px 32px rgba(0,77,121,0.12);
        padding: 2rem 2.5rem 1.5rem 2.5rem;
        margin: 4rem auto 0 auto;
        max-width: 400px;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    .login-header {
        text-align: center;
        margin-bottom: 0.7rem;
    }
    .login-header img {
        height: 90px;
        margin-bottom: 0.2rem;
    }
    .login-header p {
        color: var(--color-primario-oscuro);
        font-size: 1.1rem;
        font-weight: 500;
        margin-bottom: 0.5rem;
    }
    .form-label {
        color: var(--color-primario-oscuro);
        font-weight: 500;
        margin-bottom: 0.1rem;
    }
    .form-control {
        border-radius: 18px;
        padding: 10px 16px;
        border: 2px solid #e9ecef;
        margin-bottom: 0.5rem;
        font-size: 1rem;
    }
    .form-control:focus {
        border-color: var(--color-acento-claro);
        box-shadow: 0 0 0 0.2rem rgba(0, 165, 173, 0.25);
    }
    .btn-login {
        background: linear-gradient(135deg, var(--color-primario-oscuro) 0%, var(--color-acento-claro) 100%);
        color: var(--color-blanco);
        border: none;
        border-radius: 25px;
        padding: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-top: 0.3rem;
        width: 100%;
        box-shadow: 0 2px 8px rgba(0,77,121,0.08);
        transition: background 0.2s, transform 0.2s;
    }
    .btn-login:hover {
        background: linear-gradient(135deg, var(--color-acento-claro) 0%, var(--color-primario-oscuro) 100%);
        transform: scale(1.03);
    }
</style>
{% endblock %}

{% block content %}
<div class="login-card">
    <div class="login-header">
        {% load static %}
        <img src="{% static 'img/logos/lime.png' %}" alt="Logo LIME">
        <p>Sistema de Gestión de Equipos</p>
    </div>
    
    <form method="post" style="width: 100%;">
        {% csrf_token %}
        <div>
            <label for="username" class="form-label">Usuario</label>
            <input type="text" class="form-control" id="username" name="username" required 
                    placeholder="Ingrese su usuario">
        </div>
        <div>
            <label for="password" class="form-label">Contraseña</label>
            <input type="password" class="form-control" id="password" name="password" required 
                    placeholder="Ingrese su contraseña">
        </div>
        <button type="submit" class="btn btn-login">
            <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
        </button>
    </form>
    
    <div class="mt-4 text-center">
    </div>
</div>
{% endblock %}
